[package]
name = "rover-template-engine-napi"
version = "0.1.4"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi4", "serde-json"] }
napi-derive = { version = "3", features = ["type-def"] }
rover-template-engine = { path = "../rover-template-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
